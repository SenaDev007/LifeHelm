# Réglages Gradle standard pour machine de développement.
# NOTE : ce fichier contenait auparavant des contraintes du sandbox
# d'intégration (tas 1280m, Metaspace 512m, workers.max=1, Kotlin
# in-process). Versionnées, elles s'appliquaient à tout PC de build et
# provoquaient : OutOfMemoryError: Metaspace pendant
# :image_picker_android:lintVitalAnalyzeRelease (le lint AGP 9 tourne dans
# le daemon Gradle) et des builds release très lents (1 seul worker).
# Un sandbox contraint peut surcharger ces valeurs via la ligne de
# commande (gradle -Dorg.gradle.jvmargs=…) sans les versionner.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
