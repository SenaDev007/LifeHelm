# Sandbox contrainte : 4 Go RAM, 2 cœurs, sans swap. Le daemon Gradle et le
# daemon Kotlin séparés se font tuer (OOM) — on compile Kotlin dans le daemon
# Gradle et on limite parallélisme + tas.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
